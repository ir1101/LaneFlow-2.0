AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  LaneFlow. Event-driven PDF processing pipeline with cost-aware adaptive routing
  and per-document cost telemetry.

Parameters:
  NotificationEmail:
    Type: String
    Default: ""
    Description: Email address for notifications. Leave blank for none.
  EmailNotifications:
    Type: String
    Default: all
    AllowedValues: [all, failures]
    Description: Email every outcome, or only failures and rejected uploads.
Conditions:
  HasEmail: !Not [!Equals [!Ref NotificationEmail, ""]]
  EmailFailuresOnly: !Equals [!Ref EmailNotifications, failures]

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    CodeUri: src/
    Timeout: 60
    MemorySize: 128
    # X-Ray: every invocation is traced (subject to X-Ray's sampling), and SAM grants
    # each role permission to send trace data.
    Tracing: Active
    Layers:
      # Powertools for AWS Lambda, published by AWS. Supplies the tracer (and the X-Ray SDK)
      # without bundling extra SDK copies into the functions. Version from the public SSM
      # parameter /aws/service/powertools/python/arm64/python3.13/latest on 2026-10-16.
      - !Sub "arn:aws:lambda:${AWS::Region}:017000801446:layer:AWSLambdaPowertoolsPythonV3-python313-arm64:39"
    Environment:
      Variables:
        TABLE_NAME: !Ref DocumentsTable
        POWERTOOLS_SERVICE_NAME: laneflow
        POWERTOOLS_TRACER_CAPTURE_RESPONSE: "false"  # keep document details out of traces

Resources:
  # ---------- Encryption ----------
  # A key LaneFlow owns, used by both document buckets. Unlike the AWS managed aws/s3 key,
  # each role's policy names exactly which functions may use it and for what, it rotates
  # every year, and every use is logged in CloudTrail. Cost: about USD 1 a month.
  DocumentsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: LaneFlow document buckets (uploads and extracted text)
      EnableKeyRotation: true
      PendingWindowInDays: 7  # the shortest wait AWS allows before a deleted key is destroyed
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          # The account administers the key and grants its use through IAM policies (below,
          # per function). Without this statement nobody could manage the key again.
          - Sid: AccountAdministration
            Effect: Allow
            Principal: { AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root" }
            Action: "kms:*"
            Resource: "*"

  DocumentsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/laneflow-documents
      TargetKeyId: !Ref DocumentsKey

  # ---------- Storage ----------
  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "laneflow-uploads-${AWS::AccountId}-${AWS::Region}"
      # Browsers may only send upload forms here from the website (or local development).
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [POST]
            AllowedOrigins:
              - !Sub "https://${WebDistribution.DomainName}"
              - http://localhost:8080
            AllowedHeaders: ["*"]
            MaxAge: 600
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt DocumentsKey.Arn
            BucketKeyEnabled: true   # caches a data key so KMS is called far less often
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # Originals are only needed until they are processed. Expiring them after 7 days
      # caps storage cost and how long anyone's documents are kept.
      LifecycleConfiguration:
        Rules:
          - Id: expire-uploads
            Status: Enabled
            ExpirationInDays: 7
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  CuratedBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "laneflow-curated-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt DocumentsKey.Arn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-extracted-text
            Status: Enabled
            ExpirationInDays: 30

  # Every bucket refuses requests that do not use HTTPS, so documents never travel
  # unencrypted. Principal "*" in a Deny restricts everyone; it grants nothing.
  UploadBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt UploadBucket.Arn
              - !Sub "${UploadBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  CuratedBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CuratedBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt CuratedBucket.Arn
              - !Sub "${CuratedBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "laneflow-documents-${AWS::Region}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: requestId, AttributeType: S }
        - { AttributeName: createdAt, AttributeType: N }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        # Lists the newest jobs for the website. Only JOB records carry createdAt, so
        # this index holds jobs alone, newest first when queried in reverse.
        - IndexName: byCreatedAt
          KeySchema:
            - { AttributeName: sk, KeyType: HASH }
            - { AttributeName: createdAt, KeyType: RANGE }
          Projection:
            ProjectionType: ALL
        # Lets the reconciler find a cost record from a Lambda request ID. Only cost
        # records carry requestId, so the index stays small (a "sparse" index).
        - IndexName: byRequestId
          KeySchema:
            - { AttributeName: requestId, KeyType: HASH }
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes: [component, storageOpsUsd]

  # ---------- Messaging ----------
  JobQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: laneflow-jobs
      VisibilityTimeout: 60  # six times the dispatcher timeout, as AWS recommends
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 3

  # Receives jobs that could not be started (via the redrive policy) and jobs that
  # failed during processing (sent by the state machine).
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: laneflow-jobs-dlq
      MessageRetentionPeriod: 1209600  # 14 days, the maximum
      SqsManagedSseEnabled: true

  NotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: laneflow-notifications

  EmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties:
      TopicArn: !Ref NotificationTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail
      # Every message carries an "outcome" attribute, so the subscription can filter.
      FilterPolicy: !If
        - EmailFailuresOnly
        - { outcome: [failure, rejected] }
        - !Ref AWS::NoValue

  # ---------- Functions ----------
  # Each function's policy names only the actions it calls, on only the resources it uses.
  ValidatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: laneflow-validator
      Handler: validator.handler
      Environment:
        Variables:
          QUEUE_URL: !Ref JobQueue
          TOPIC_ARN: !Ref NotificationTopic
      Policies:
        - Statement:
            # The bucket ARN is built with !Sub rather than !GetAtt to avoid a circular
            # dependency: the bucket's event notification already depends on this function.
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "arn:aws:s3:::laneflow-uploads-${AWS::AccountId}-${AWS::Region}/*"
            - Effect: Allow
              Action: kms:Decrypt  # reading an upload decrypts it with the documents key
              Resource: !GetAtt DocumentsKey.Arn
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt DocumentsTable.Arn
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt JobQueue.Arn
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref NotificationTopic
      Events:
        Upload:
          Type: S3
          Properties:
            Bucket: !Ref UploadBucket
            Events: s3:ObjectCreated:*

  DispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: laneflow-dispatcher
      Handler: dispatcher.handler
      Timeout: 10
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref PipelineStateMachine
      Policies:
        - Statement:
            - Effect: Allow
              Action: states:StartExecution
              Resource: !Ref PipelineStateMachine
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt DocumentsTable.Arn
      Events:
        Jobs:
          Type: SQS
          Properties:
            Queue: !GetAtt JobQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: 2

  ClassifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: laneflow-classifier
      Handler: classifier.handler
      MemorySize: 128  # cheapest on average in Power Tuning (it reads only a few KB of each PDF)
      Environment:
        Variables:
          # Lane sizes and this threshold come from AWS Lambda Power Tuning
          # (results/power_tuning.json), using one rule: the cheapest memory that extracts
          # a document in under 5 seconds. At 256 MB extraction takes about 100 ms plus
          # 44 ms per page, so documents up to about 110 pages (a score of about 120 for
          # text PDFs) meet the target in the light lane.
          LIGHT_MAX_SCORE: "120"
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${UploadBucket.Arn}/*"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !GetAtt DocumentsKey.Arn
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt DocumentsTable.Arn

  LightExtractFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: laneflow-extract-light
      Handler: extractor.handler
      MemorySize: 256  # within 11% of the cheapest setting for 1 to 80 pages
      Timeout: 120
      Environment:
        Variables:
          LANE: light
          CURATED_BUCKET: !Ref CuratedBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${UploadBucket.Arn}/*"
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${CuratedBucket.Arn}/text/*"
            - Effect: Allow
              Action: [kms:Decrypt, kms:GenerateDataKey]  # read the upload, encrypt the text
              Resource: !GetAtt DocumentsKey.Arn
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt DocumentsTable.Arn

  HeavyExtractFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: laneflow-extract-heavy
      Handler: extractor.handler
      MemorySize: 1024  # cheapest setting that extracts 300 pages in under 5 seconds (3.6 s)
      Timeout: 300
      Environment:
        Variables:
          LANE: heavy
          CURATED_BUCKET: !Ref CuratedBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${UploadBucket.Arn}/*"
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${CuratedBucket.Arn}/text/*"
            - Effect: Allow
              Action: [kms:Decrypt, kms:GenerateDataKey]  # read the upload, encrypt the text
              Resource: !GetAtt DocumentsKey.Arn
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt DocumentsTable.Arn

  BaselineExtractFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: laneflow-extract-baseline
      Handler: extractor.handler
      MemorySize: 3008  # deliberately over-provisioned: the naive "one size fits all" design
      Timeout: 300
      Environment:
        Variables:
          LANE: baseline
          CURATED_BUCKET: !Ref CuratedBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${UploadBucket.Arn}/*"
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${CuratedBucket.Arn}/text/*"
            - Effect: Allow
              Action: [kms:Decrypt, kms:GenerateDataKey]  # read the upload, encrypt the text
              Resource: !GetAtt DocumentsKey.Arn
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt DocumentsTable.Arn

  # Reads every pipeline function's REPORT log lines and records the actual billed cost.
  CostReconcilerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: laneflow-cost-reconciler
      Handler: reconciler.handler
      Timeout: 30
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${DocumentsTable.Arn}/index/byRequestId"
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt DocumentsTable.Arn
      Events:
        ValidatorReports:
          Type: CloudWatchLogs
          Properties: { LogGroupName: !Ref ValidatorLogs, FilterPattern: '"REPORT RequestId"' }
        DispatcherReports:
          Type: CloudWatchLogs
          Properties: { LogGroupName: !Ref DispatcherLogs, FilterPattern: '"REPORT RequestId"' }
        ClassifierReports:
          Type: CloudWatchLogs
          Properties: { LogGroupName: !Ref ClassifierLogs, FilterPattern: '"REPORT RequestId"' }
        LightExtractReports:
          Type: CloudWatchLogs
          Properties: { LogGroupName: !Ref LightExtractLogs, FilterPattern: '"REPORT RequestId"' }
        HeavyExtractReports:
          Type: CloudWatchLogs
          Properties: { LogGroupName: !Ref HeavyExtractLogs, FilterPattern: '"REPORT RequestId"' }
        BaselineExtractReports:
          Type: CloudWatchLogs
          Properties: { LogGroupName: !Ref BaselineExtractLogs, FilterPattern: '"REPORT RequestId"' }

  # ---------- Website API ----------
  WebApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # The site calls the API through CloudFront on the same address, so CORS is only
      # needed for local development.
      CorsConfiguration:
        AllowOrigins: ["http://localhost:8080"]
        AllowMethods: [GET, POST]
        AllowHeaders: [content-type]
        MaxAge: 600
      # Caps request rates so a public page cannot be used to run up costs.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: laneflow-api
      Handler: api.handler
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          # Named rather than referenced, to avoid a circular dependency through the
          # upload bucket's CORS rule, which refers to the CloudFront distribution.
          UPLOAD_BUCKET: !Sub "laneflow-uploads-${AWS::AccountId}-${AWS::Region}"
          CURATED_BUCKET: !Ref CuratedBucket
      Policies:
        - Statement:
            # Upload forms are signed with this role, so it may only write uploads.
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "arn:aws:s3:::laneflow-uploads-${AWS::AccountId}-${AWS::Region}/*"
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${CuratedBucket.Arn}/text/*"
            # Signed upload forms encrypt with the documents key; signed text links decrypt.
            - Effect: Allow
              Action: [kms:Decrypt, kms:GenerateDataKey]
              Resource: !GetAtt DocumentsKey.Arn
            - Effect: Allow
              Action: [dynamodb:Query, dynamodb:GetItem, dynamodb:BatchGetItem]
              Resource:
                - !GetAtt DocumentsTable.Arn
                - !Sub "${DocumentsTable.Arn}/index/byCreatedAt"
      Events:
        CreateUpload:
          Type: HttpApi
          Properties: { ApiId: !Ref WebApi, Path: /api/uploads, Method: POST }
        ListDocuments:
          Type: HttpApi
          Properties: { ApiId: !Ref WebApi, Path: /api/documents, Method: GET }
        GetDocument:
          Type: HttpApi
          Properties: { ApiId: !Ref WebApi, Path: "/api/documents/{docId}", Method: GET }
        GetText:
          Type: HttpApi
          Properties: { ApiId: !Ref WebApi, Path: "/api/documents/{docId}/text", Method: GET }
        Health:
          Type: HttpApi
          Properties: { ApiId: !Ref WebApi, Path: /api/health, Method: GET }

  # Log groups are declared so they are deleted with the stack and keep logs for 7 days only.
  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /aws/lambda/laneflow-api, RetentionInDays: 7 }
  ValidatorLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /aws/lambda/laneflow-validator, RetentionInDays: 7 }
  DispatcherLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /aws/lambda/laneflow-dispatcher, RetentionInDays: 7 }
  ClassifierLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /aws/lambda/laneflow-classifier, RetentionInDays: 7 }
  LightExtractLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /aws/lambda/laneflow-extract-light, RetentionInDays: 7 }
  HeavyExtractLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /aws/lambda/laneflow-extract-heavy, RetentionInDays: 7 }
  BaselineExtractLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /aws/lambda/laneflow-extract-baseline, RetentionInDays: 7 }
  CostReconcilerLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /aws/lambda/laneflow-cost-reconciler, RetentionInDays: 7 }

  # ---------- Orchestration ----------
  # Express rather than Standard: Standard bills USD 0.000025 per state transition,
  # which measured at about five times the Lambda saving that routing achieves.
  # Express bills per execution plus duration, so the extra Classify step is almost free.
  PipelineLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/vendedlogs/states/laneflow-pipeline-express
      RetentionInDays: 7

  PipelineStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: laneflow-pipeline-express
      Type: EXPRESS
      # Continues the dispatcher's X-Ray trace through every state and Lambda invocation.
      Tracing:
        Enabled: true
      # Express executions only appear in the console when logging is on. Level ALL
      # also records each run's start and end times, which the cost analysis uses.
      # Execution data (the documents' JSON) is left out to keep log volume down.
      Logging:
        Level: ALL
        IncludeExecutionData: false
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt PipelineLogs.Arn
      DefinitionUri: statemachine/pipeline.asl.json
      DefinitionSubstitutions:
        ClassifierArn: !GetAtt ClassifierFunction.Arn
        LightExtractArn: !GetAtt LightExtractFunction.Arn
        HeavyExtractArn: !GetAtt HeavyExtractFunction.Arn
        BaselineExtractArn: !GetAtt BaselineExtractFunction.Arn
        TopicArn: !Ref NotificationTopic
        TableName: !Ref DocumentsTable
        DeadLetterQueueUrl: !Ref DeadLetterQueue
      Policies:
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource:
                - !GetAtt ClassifierFunction.Arn
                - !GetAtt LightExtractFunction.Arn
                - !GetAtt HeavyExtractFunction.Arn
                - !GetAtt BaselineExtractFunction.Arn
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt DocumentsTable.Arn
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt DeadLetterQueue.Arn
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref NotificationTopic
            # X-Ray accepts trace data only through these account-level actions.
            - Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
                - xray:GetSamplingRules
                - xray:GetSamplingTargets
              Resource: "*"
            # Log delivery for Step Functions is set up through these account-level
            # actions, which AWS only supports on Resource "*".
            - Effect: Allow
              Action:
                - logs:CreateLogDelivery
                - logs:GetLogDelivery
                - logs:UpdateLogDelivery
                - logs:DeleteLogDelivery
                - logs:ListLogDeliveries
                - logs:PutResourcePolicy
                - logs:DescribeResourcePolicies
                - logs:DescribeLogGroups
              Resource: "*"

  # ---------- Website hosting ----------
  # Private bucket: only CloudFront can read it. S3-managed encryption is used here
  # because the site's files are public content, and CloudFront cannot read objects
  # encrypted with the AWS managed KMS key.
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "laneflow-web-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "laneflow-web-${AWS::Region}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: LaneFlow website and API
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200  # includes edge locations in India
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !Sub "${WebApi}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03  # Managed-SecurityHeadersPolicy
        CacheBehaviors:
          # API calls are never cached and reach API Gateway on the same address as the site.
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt WebBucket.Arn
              - !Sub "${WebBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ---------- Monitoring ----------
  DeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: laneflow-dlq-not-empty
      AlarmDescription: A job failed and is waiting in the dead letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - { Name: QueueName, Value: !GetAtt DeadLetterQueue.QueueName }
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref NotificationTopic]

  FailedExecutionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: laneflow-executions-failed
      AlarmDescription: At least one pipeline execution failed.
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - { Name: StateMachineArn, Value: !Ref PipelineStateMachine }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref NotificationTopic]

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: laneflow
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 8, "height": 6,
              "properties": {
                "title": "Pipeline executions", "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries",
                "metrics": [
                  ["AWS/States", "ExecutionsStarted", "StateMachineArn", "${PipelineStateMachine}"],
                  [".", "ExecutionsSucceeded", ".", "."],
                  [".", "ExecutionsFailed", ".", "."]
                ]
              }
            },
            {
              "type": "metric", "x": 8, "y": 0, "width": 8, "height": 6,
              "properties": {
                "title": "Documents per lane", "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "laneflow-extract-light", {"label": "light lane (256 MB)"}],
                  ["...", "laneflow-extract-heavy", {"label": "heavy lane (1024 MB)"}],
                  ["...", "laneflow-extract-baseline", {"label": "baseline (3008 MB)"}]
                ]
              }
            },
            {
              "type": "alarm", "x": 16, "y": 0, "width": 8, "height": 6,
              "properties": {
                "title": "Alarms",
                "alarms": ["${DeadLetterAlarm.Arn}", "${FailedExecutionsAlarm.Arn}"]
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Average billed cost per invocation (USD, reconciled)", "region": "${AWS::Region}", "stat": "Average", "period": 300, "view": "timeSeries",
                "metrics": [
                  ["LaneFlow", "InvocationCostUsd", "Component", "extract-light"],
                  ["...", "extract-heavy"],
                  ["...", "extract-baseline"],
                  ["...", "classifier"]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Extractor duration (ms, average)", "region": "${AWS::Region}", "stat": "Average", "period": 300, "view": "timeSeries",
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "laneflow-extract-light"],
                  ["...", "laneflow-extract-heavy"],
                  ["...", "laneflow-extract-baseline"]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "Queue depth", "region": "${AWS::Region}", "stat": "Maximum", "period": 60, "view": "timeSeries",
                "metrics": [
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "laneflow-jobs", {"label": "job queue"}],
                  ["...", "laneflow-jobs-dlq", {"label": "dead letter queue"}]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda errors", "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries",
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "laneflow-validator"],
                  ["...", "laneflow-dispatcher"],
                  ["...", "laneflow-classifier"],
                  ["...", "laneflow-extract-light"],
                  ["...", "laneflow-extract-heavy"],
                  ["...", "laneflow-extract-baseline"],
                  ["...", "laneflow-cost-reconciler"]
                ]
              }
            }
          ]
        }

Outputs:
  UploadBucketName:
    Value: !Ref UploadBucket
  CuratedBucketName:
    Value: !Ref CuratedBucket
  DocumentsTableName:
    Value: !Ref DocumentsTable
  StateMachineArn:
    Value: !Ref PipelineStateMachine
  DeadLetterQueueUrl:
    Value: !Ref DeadLetterQueue
  DashboardUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/laneflow"
  WebsiteUrl:
    Value: !Sub "https://${WebDistribution.DomainName}"
  WebBucketName:
    Value: !Ref WebBucket
  DistributionId:
    Value: !Ref WebDistribution
  ApiUrl:
    Value: !Sub "https://${WebApi}.execute-api.${AWS::Region}.amazonaws.com"
